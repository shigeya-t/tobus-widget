name: TobusWidget
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.13.7

targets:
  TobusWidget:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
      - target: TobusWidgetExtension
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - TobusWidgetTests
    info:
      path: App/Info.plist
      properties:
        # Dock（今は LSUIElement なので出ない）やメニューバー、システム設定での表示名。
        # ウィジェットギャラリーのアプリ一覧はこれを見ていない（.app のファイル名を見る）ので、
        # 一覧には ASCII の「TobusWidget」が出る。上の WRAPPER_NAME のコメント参照。
        CFBundleName: 都バス接近情報
        CFBundleDisplayName: 都バス接近情報
        # メニューバー常駐アプリ。Dock とアプリスイッチャーには出さない
        LSUIElement: true
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: App/TobusWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # 一時停止フラグ・選択中の停留所/系統をアプリとウィジェット拡張で共有するために必要
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TobusWidget
        # .app のバンドル名は ASCII（TobusWidget.app）のままにすること。
        # ウィジェットギャラリーのアプリ一覧を日本語にしたくて WRAPPER_NAME に
        # 「都バス接近情報.app」を指定したことがあるが、ウィジェット拡張が起動できなくなる。
        # 「バ」が分解可能な文字で、LaunchServices は NFC・PluginKit は NFD でパスを持つため、
        # ExtensionKit のパス照合が一致しない（CLAUDE.md「開発中に踏んだ既知の落とし穴」参照）。
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        # App Group は macOS では Team ID プレフィックスが必須。
        # フォーク時は DEVELOPMENT_TEAM を指定すれば全体に反映される。
        APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.example.TobusWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TobusWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension
      - path: Shared
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleName: 都バス接近情報
        CFBundleDisplayName: 都バス接近情報
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: WidgetExtension/TobusWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TobusWidget.Widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.example.TobusWidget
        SKIP_INSTALL: false

  # ホストアプリを立てない単体テスト。TobusWidget をテストホストにすると、
  # 常駐アプリが起動して初回取得（tobus.jpへの通信）が走ってしまうため、
  # Shared のソースを直接取り込む構成にしている。
  TobusWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Shared
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TobusWidget.Tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
